name: '@miethe/ui CI'

# Hosted GitHub Actions is out estate-wide (2026-10-01 decision); PR/push/schedule triggers disabled.
# Elastic CI replaces this gate: node_01M3VZCY1FP6WFM8ZJAZH7YSRH. Landing is on a recorded local-test-pass.
# Manual runs stay available via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — action-setup reads `packageManager` from package.json,
      # so the pnpm version is declared in exactly one place. Pinning `version: 8` here while
      # pnpm-lock.yaml was lockfileVersion 9.0 is what broke every run: pnpm 8 cannot read a v9
      # lockfile, logs "Ignoring not compatible lockfile", then treats it as ABSENT — so
      # `--frozen-lockfile` failed with ERR_PNPM_NO_LOCKFILE on every branch, ~15s in.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      # `pnpm test --ci` does NOT work: pnpm parses `--ci` as its own flag and exits with
      # "Unknown option: 'ci'". The `--` is required to forward the flag to jest.
      - name: Test
        run: pnpm test -- --ci
